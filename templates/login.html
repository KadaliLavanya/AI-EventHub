<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>Login - AI EventHub</title>

        <link rel="stylesheet"
            href="{{ url_for('static', filename='style.css') }}">

    </head>

    <body>

        <nav class="top-navbar">

            <div class="nav-container">

                <div class="logo">
                    AI EventHub
                </div>

                <div class="nav-menu">

                    <a href="{{ url_for('home') }}">Home</a>

                    <a href="{{ url_for('events') }}">Events</a>

                    <a href="{{ url_for('login') }}">Login</a>

                    <a href="{{ url_for('register') }}">Register</a>

                    <a href="{{ url_for('admin_login') }}">Admin</a>

                </div>

            </div>

        </nav>

        <main class="login-page">

            <div class="login-container">

                <div class="login-box">

                    <h1>
                        Welcome Back
                    </h1>

                    <p>
                        Login to your AI EventHub account.
                    </p>

                    <form
                        method="POST"
                        action="{{ url_for('login') }}"
                        class="login-form">

                        <!-- EMAIL -->

                        <div class="form-group">

                            <label>
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                placeholder="Enter your email"
                                required>

                        </div>

                        <!-- PASSWORD -->

                        <div class="form-group">

                            <label>
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                placeholder="Enter your password"
                                required>

                        </div>

                        <!-- LOGIN -->

                        <button
                            type="submit"
                            class="login-button">

                            Login

                        </button>

                    </form>

                    <div class="login-footer">

                        Don't have an account?

                        <a href="{{ url_for('register') }}">
                            Create Account
                        </a>

                    </div>

                </div>

            </div>

        </main>

    </body>

</html>
