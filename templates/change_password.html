<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>Change Password - AI EventHub</title>

        <link rel="stylesheet"
            href="{{ url_for('static', filename='style.css') }}">

    </head>

    <body>

        <nav class="top-navbar">

            <div class="nav-container">

                <div class="logo">
                    AI EventHub
                </div>

                <div class="nav-menu">

                    <a href="{{ url_for('dashboard') }}">
                        Dashboard
                    </a>

                    <a href="{{ url_for('events') }}">
                        Events
                    </a>

                    <a href="{{ url_for('profile') }}">
                        Profile
                    </a>

                    <a href="{{ url_for('logout') }}">
                        Logout
                    </a>

                </div>

            </div>

        </nav>

        <main class="simple-page">

            <div class="simple-box change-password-box">

                <div class="simple-box-header">

                    <div>

                        <h1>
                            Change Password
                        </h1>

                        <p class="simple-subtitle">
                            Update your account password securely.
                        </p>

                    </div>

                </div>

                {% if message %}

                <div class="password-success-message">
                    {{ message }}
                </div>

                {% endif %}

                {% if error %}

                <div class="password-error-message">
                    {{ error }}
                </div>

                {% endif %}

                <form method="POST" class="change-password-form">

                    <!-- CURRENT PASSWORD -->

                    <div class="change-password-field">

                        <label>
                            Current Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="current-password"
                                name="current_password"
                                placeholder="Enter current password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('current-password', this)"
                                aria-label="Show password">

                                👁️

                            </button>

                        </div>

                    </div>

                    <!-- NEW PASSWORD -->

                    <div class="change-password-field">

                        <label>
                            New Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="new-password"
                                name="new_password"
                                placeholder="Enter new password"
                                minlength="6"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('new-password', this)"
                                aria-label="Show password">

                                👁️

                            </button>

                        </div>

                    </div>

                    <!-- CONFIRM PASSWORD -->

                    <div class="change-password-field">

                        <label>
                            Confirm New Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirm-password"
                                name="confirm_password"
                                placeholder="Confirm new password"
                                minlength="6"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('confirm-password', this)"
                                aria-label="Show password">

                                👁️

                            </button>

                        </div>

                    </div>

                    <button
                        type="submit"
                        class="change-password-submit">

                        Change Password

                    </button>

                </form>

                <a
                    href="{{ url_for('profile') }}"
                    class="change-password-back">

                    ← Back to Profile

                </a>

            </div>

        </main>

        <script>

        function togglePassword(inputId, button) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                button.textContent = "🙈";

                button.setAttribute("aria-label", "Hide password");

            } else {

                input.type = "password";

                button.textContent = "👁️";

                button.setAttribute("aria-label", "Show password");

            }

        }

    </script>

    </body>

</html>
