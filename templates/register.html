<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>Create Account - AI EventHub</title>

        <link rel="stylesheet"
            href="{{ url_for('static', filename='style.css') }}">

    </head>

    <body>

        <!-- NAVBAR -->

        <nav class="top-navbar">

            <div class="nav-container">

                <div class="logo">
                    AI EventHub
                </div>

                <div class="nav-menu">

                    <a href="{{ url_for('home') }}">
                        Home
                    </a>

                    <a href="{{ url_for('events') }}">
                        Events
                    </a>

                    <a href="{{ url_for('login') }}">
                        Login
                    </a>

                    <a href="{{ url_for('register') }}">
                        Register
                    </a>

                    <a href="{{ url_for('admin_login') }}">
                        Admin
                    </a>

                </div>

            </div>

        </nav>

        <!-- CREATE ACCOUNT -->

        <main class="register-page">

            <div class="register-container">

                <div class="register-box">

                    <h1>
                        Create Account
                    </h1>

                    <p>
                        Register to explore and participate in college events.
                    </p>

                    <form
                        method="POST"
                        action="{{ url_for('register') }}"
                        class="register-form">

                        <!-- NAME -->

                        <div class="register-field">

                            <label>
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                placeholder="Enter your full name"
                                required>

                        </div>

                        <!-- EMAIL -->

                        <div class="register-field">

                            <label>
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                placeholder="Enter your email"
                                required>

                        </div>

                        <!-- PASSWORD -->

                        <div class="register-field">

                            <label>
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                placeholder="Create a password"
                                required>

                        </div>

                        <!-- BRANCH -->

                        <div class="register-field">

                            <label>
                                Branch
                            </label>

                            <select name="branch" required>

                                <option value>
                                    Select your branch
                                </option>

                                <option value="CSE">
                                    CSE
                                </option>

                                <option value="ECE">
                                    ECE
                                </option>

                                <option value="EEE">
                                    EEE
                                </option>

                                <option value="Mechanical">
                                    Mechanical
                                </option>

                                <option value="Civil">
                                    Civil
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>

                        <!-- YEAR -->

                        <div class="register-field">

                            <label>
                                Year
                            </label>

                            <select name="year" required>

                                <option value>
                                    Select your year
                                </option>

                                <option value="1st Year">
                                    1st Year
                                </option>

                                <option value="2nd Year">
                                    2nd Year
                                </option>

                                <option value="3rd Year">
                                    3rd Year
                                </option>

                                <option value="4th Year">
                                    4th Year
                                </option>

                            </select>

                        </div>

                        <!-- INTEREST -->

                        <div class="register-field">

                            <label>
                                Area of Interest
                            </label>

                            <select name="interest" required>

                                <option value>
                                    Select your interest
                                </option>

                                <option value="AI & ML">
                                    AI & ML
                                </option>

                                <option value="Web Development">
                                    Web Development
                                </option>

                                <option value="Coding">
                                    Coding
                                </option>

                                <option value="Hackathon">
                                    Hackathon
                                </option>

                            </select>

                        </div>

                        <!-- BUTTON -->

                        <button
                            type="submit"
                            class="register-button">

                            Create Account

                        </button>

                    </form>

                    <div class="register-footer">

                        Already have an account?

                        <a href="{{ url_for('login') }}">
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </main>

    </body>

</html>
